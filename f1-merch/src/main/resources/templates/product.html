<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head(${product.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container page">
    <nav class="breadcrumbs">
        <a th:href="@{/}">Главная</a> /
        <a th:href="@{/catalog}">Каталог</a> /
        <a th:href="@{/catalog(category=${product.category})}" th:text="${product.category.title}">Категория</a>
    </nav>

    <div class="alert alert--ok" th:if="${message}">
        <span th:text="${message}"></span>
        <a th:href="@{/cart}" class="link">Перейти в корзину →</a>
    </div>
    <div class="alert alert--error" th:if="${error}" th:text="${error}"></div>

    <div class="product">
        <div class="product__image" th:style="'background:' + ${product.team.gradient}">
            <span th:text="${product.icon}">👕</span>
        </div>

        <div class="product__info">
            <a th:href="@{/catalog(team=${product.team})}" class="product__team"
               th:style="'color:' + ${product.team.colorLight}" th:text="${product.team.title}">Team</a>
            <h1 th:text="${product.name}">Название</h1>
            <div class="price price--big"
                 th:text="${#numbers.formatDecimal(product.price, 1, 'WHITESPACE', 0, 'POINT')} + ' ₸'">0 ₸</div>
            <p class="product__desc" th:text="${product.description}">Описание</p>

            <form th:action="@{/cart/add}" method="post" class="buy">
                <input type="hidden" name="productId" th:value="${product.id}">

                <div th:if="${product.hasSizes()}">
                    <span class="filters__label">Размер</span>
                    <div class="sizes">
                        <label th:each="s, st : ${product.sizes}" class="size">
                            <input type="radio" name="size" th:value="${s}" th:checked="${#lists.size(product.sizes) == 1}">
                            <span th:text="${s}">M</span>
                        </label>
                    </div>
                </div>

                <span class="filters__label">Количество</span>
                <div class="buy__row">
                    <input type="number" name="quantity" value="1" min="1" max="99" class="qty">
                    <button type="submit" class="btn">Добавить в корзину</button>
                </div>
            </form>

            <ul class="product__perks">
                <li>🚚 Доставка 2–5 дней</li>
                <li>✅ Оригинальная продукция</li>
                <li>↩️ Возврат в течение 14 дней</li>
            </ul>
        </div>
    </div>

    <section class="section" th:unless="${related.isEmpty()}">
        <h2 class="section__title">Вам может понравиться</h2>
        <div class="grid">
            <th:block th:each="p : ${related}"><div th:replace="~{fragments/layout :: productCard(${p})}"></div></th:block>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
